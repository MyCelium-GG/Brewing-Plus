name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: buildSrc matches the shared copy
        uses: MyCelium-GG/MyCel-Lib/.github/actions/buildsrc-check@v1
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Build all loaders + tests
        run: ./gradlew build --no-daemon
