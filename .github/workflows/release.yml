name: release

# Cut a release by pushing a version tag (e.g. 1.0.0): builds the three loader
# jars, attaches them to a GitHub Release and uploads them to CurseForge
# (project id and side in gradle.properties, token in the CURSEFORGE_TOKEN
# secret) and Modrinth (modrinth_project_id and modrinth_environment, token in
# MODRINTH_TOKEN). Run it by hand with an existing tag to (re)publish that version.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
      curseforge:
        description: Upload to CurseForge
        type: boolean
        default: true
      modrinth:
        description: Upload to Modrinth
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Build loader jars
        run: ./gradlew :fabric:build :forge:build :neoforge:build --no-daemon
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; leaving it as is."
            exit 0
          fi
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          gh release create "$TAG" \
            --title "Brewing+ $TAG" \
            --notes "For Minecraft $MC_VERSION (Fabric, Forge, NeoForge). Requires Mycel and Java 25." \
            $(ls fabric/build/libs/brewingplus-*.jar forge/build/libs/brewingplus-*.jar neoforge/build/libs/brewingplus-*.jar | grep -vE -- '-(sources|javadoc)\.jar$')
      - name: Upload to CurseForge
        if: ${{ github.event_name == 'push' || inputs.curseforge }}
        uses: MyCelium-GG/MyCel-Lib/.github/actions/curseforge-upload@v1
        with:
          token: ${{ secrets.CURSEFORGE_TOKEN }}
          name: Brewing+
          version: ${{ env.TAG }}
          files: |
            fabric=fabric/build/libs/brewingplus-fabric-*.jar
            forge=forge/build/libs/brewingplus-forge-*.jar
            neoforge=neoforge/build/libs/brewingplus-neoforge-*.jar
      - name: Upload to Modrinth
        if: ${{ github.event_name == 'push' || inputs.modrinth }}
        uses: MyCelium-GG/MyCel-Lib/.github/actions/modrinth-upload@v1
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          name: Brewing+
          version: ${{ env.TAG }}
          files: |
            fabric=fabric/build/libs/brewingplus-fabric-*.jar
            forge=forge/build/libs/brewingplus-forge-*.jar
            neoforge=neoforge/build/libs/brewingplus-neoforge-*.jar
      # Only for new tags: re-running an old release by hand must not announce
      # it again.
      - name: Announce on Discord
        if: ${{ github.event_name == 'push' }}
        uses: MyCelium-GG/MyCel-Lib/.github/actions/discord-announce@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          version: ${{ env.TAG }}
