name: release

# Cut a release by pushing a version tag (e.g. 1.0.0).
# Builds all three loader jars (plus sources) and attaches them to a
# GitHub Release.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Build loader jars
        run: ./gradlew :fabric:build :forge:build :neoforge:build --no-daemon
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          gh release create "$GITHUB_REF_NAME" \
            --title "Brewing+ $GITHUB_REF_NAME" \
            --notes "For Minecraft $MC_VERSION (Fabric, Forge, NeoForge). Requires Mycel and Java 25." \
            fabric/build/libs/brewingplus-*.jar \
            forge/build/libs/brewingplus-*.jar \
            neoforge/build/libs/brewingplus-*.jar
