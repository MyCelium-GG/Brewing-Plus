# Brewing+ — tiny QoL mod on the Mycel library.
# Minecraft 26.3 / Java 25 / Fabric + Forge + NeoForge.
# Every property used by a loader module must also be listed in
# buildSrc/src/main/groovy/modloader-common.gradle (expandProps).

# Project / publishing. The group intentionally extends Mycel's group so this
# mod's modules never share implicit Gradle capabilities with Mycel's own
# modules (e.g. my.celium.org:fabric), which would break dependency resolution.
version=1.0.3
group=my.celium.org.brewingplus
java_version=25

# Common
minecraft_version=26.3
minecraft_version_range=[26.3,26.4)
## NeoForm for MC 26.3, see https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1
mod_id=brewingplus
mod_name=Brewing+
mod_author=MyCelium
mod_license=MIT
credits=MyCelium
description=A brewing guide on the brewing stand: every potion's full recipe chain, what you need and what you can brew now, what each ingredient does, and a live hint in the stand showing the next ingredient. Client-side.

# Mycel (shared library) via JitPack, see https://jitpack.io/#MyCelium-GG/MyCel-Lib
# Single universal artifact for all loaders.
mycel_version=1.4.1
mycel_coordinates=com.github.MyCelium-GG:MyCel-Lib:1.4.1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.160.6+26.3
fabric_loader_version=0.19.5

# Forge 26.x (ForgeGradle 7), see https://files.minecraftforge.net/net/minecraftforge/forge/
forge_version=26.3-66.0.9
forge_loader_version_range=[66,)

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.3.0.1-beta
neoforge_loader_version_range=[4,)

# Testing
junit_version=5.11.4

# Required by ForgeGradle 7 (see the official 26.x MDK).
net.minecraftforge.gradle.merge-source-sets=true

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# CurseForge publishing (release workflow). Empty project id = skip CurseForge.
curseforge_project_id=1756438
# client, server or both
curseforge_environment=client

# Modrinth publishing (release workflow). Empty project id = skip Modrinth.
modrinth_project_id=q6dgnQLf
# Modrinth's side setting: client_only, server_only_client_optional, client_or_server_prefers_both, ...
modrinth_environment=client_only
